# KON-Artist Training Configuration
# Colab 5h limit: 70,560 to 88,200 steps max (17~21 iterations for 4096 n_steps)

# PPO Hyperparameters
ppo:
  total_updates: 150 # Total number of PPO updates (each update processes N_STEPS)
  n_steps: 4096 # 2048 is PPO's default rollout buffer size; adjust if using a custom buffer implementation
  epochs: 4 # Number of epochs per PPO update (default is 4 in stable-baselines3)
  batch_size: 512 # Batch size for PPO updates (default is 64 in stable-baselines3, but can be adjusted based on memory constraints)
  clip_range: 0.15 # PPO clipping parameter (default is 0.2, but can be adjusted for stability)
  learning_rate: 0.00015 # Learning rate for PPO optimizer (default is 0.0003 in stable-baselines3)
  entropy:
    initial: 0.12 # Initial entropy coefficient (encourages exploration)
    final: 0.03  # Final entropy coefficient (can be decayed over time to encourage exploitation)
    mode: "cycle" # 'global' (decay over cumulative total steps) or 'cycle' (decay relative to the current session/cycle steps)
  bonus: True # Whether to use a reward bonus for successful episodes (can be adjusted based on task requirements)
  bonus_amount: 75.0 # Multiplier for the continuous reward bonus
  policy: "SquashedGaussianActorCriticPolicy"
  verbose: 1

# Environment Settings
env:
  n_envs: -1 # -1 means auto-scale based on CPU cores (All cores - 1)
  seed: 42
  success_threshold: 0.5 # Threshold for considering an episode successful (based on reward)
  step_limit: 10  # Maximum steps per episode to prevent infinite loops (can be adjusted based on task complexity. Max 25550)

# Audio Data Settings
audio:
  split: "train"
  buffer_size: 25500 # Number of audio samples into memory at once for training. Adjust based on available RAM. (Ideally between 5,000 and 20,000 for ASVspoof)

# Acoustic Clustering Settings
clustering:
  pca_components: 32
  n_components: 10
  model_path: "models/gmm_registry.pkl"
  
  # 1. Cluster Exclusion Configuration
  # Specify cluster indices to omit entirely from the dataset loop
  exclude_clusters: [2, 5, 6, 7] # Based on RUN 20260614_003526)

  # 3. Action-Space Boundary Contraction parameters
  asr_compression_threshold: 0.25 # Lowered from 0.35 to catch Cluster 1 (26.95% ASR) and initiate contraction
  max_compression_factor: 0.85     # Contract action bounds aggressively to drive exploration out of easy zones
  compression_alpha: 1.5           # Linear-concave boundary shift multiplier

  # 2. Dynamic Action Noise Scaling parameters
  dynamic_noise:
    enabled: true
    exploration_floor: 0.3    # Minimum scaling multiplier for highly successful clusters
    exploration_ceiling: 1.8  # Maximum scaling multiplier for highly resilient clusters
    asr_update_window: 4096   # Rolling step window used to compute real-time cluster ASR
  
  # A) Cluster Inverse Frequencies (Based on Empirical Footprint Shares)
  # Lower share = Higher reward multiplier to combat minority starvation
  inverse_frequency_multipliers:
    0: 1.08
    1: 7.12
    2: 3.50  # Excluded cluster
    3: 1.00
    4: 2.39
    5: 1.16  # Excluded cluster
    6: 5.20  # Excluded cluster
    7: 11.11  # Excluded cluster
    8: 1.64
    9: 2.59

  # B) Cluster-Conditioned Translation Matrix (Seeded from RUN 20260614_003526)
  # Default starting signature [jitter, shimmer, tilt, harmonics, threshold, ratio, bitrate] per cluster
  cluster_biases:
    - [-0.53, 1.00, -1.00, 0.34, 0.36, -1.00, 0.96]   # Cluster 0
    - [-0.41, 0.45, -0.83, 0.61, 0.35, -0.89, 0.84]   # Cluster 1
    - [0.32, -0.01, -0.71, 0.51, 0.35, -0.94, 0.12]   # Cluster 2 (Excluded)
    - [-0.59, 0.67, -0.78, 1.00, 0.30, -0.85, -0.68]  # Cluster 3 -> Captures downsampling mapping
    - [-0.70, 0.43, -0.93, 0.92, 0.41, -0.93, 0.73]   # Cluster 4
    - [-0.38, -0.23, -0.75, 0.72, 0.37, -0.84, 0.40]  # Cluster 5 (Baseline)
    - [-0.25, 0.02, -0.51, 0.70, 0.35, -0.90, 0.11]   # Cluster 6 (Excluded)
    - [-0.13, -0.17, -0.88, 0.29, -0.14, -0.72, 0.43] # Cluster 7 (Excluded)
    - [-0.37, -0.06, -0.70, 0.77, 0.66, -0.91, 0.53]  # Cluster 8
    - [-1.00, 1.00, 0.11, -0.46, 1.00, -1.00, 1.00]   # Cluster 9

  # C) Auxiliary Reward Shaping Configuration
  auxiliary_reward:
    enabled: true
    stagnation_penalty: -5.0 # Applied if AASIST3 score remains exactly 0.0000
    fidelity_weight: 2.0     # Penalty multiplier for straying from Hi-Fi parameters

# Model Settings
model:
  detector_name: "MTUCI/AASIST3"
  device: "cuda" # Execution hardware: "cuda" (Enforced GPU) or "cpu" (Standard execution)

# Logging & Callbacks
logging:
  log_dir: "outputs/"
  tensorboard_log: null # Set to a path if tensorboard is needed
  reward_log_freq: 1 # Log rewards every N updates (will be converted to steps in script)
  time_per_step: 0.17842 # Average time per step in seconds for estimation 
  checkpoint:
    save_freq: 1 # Number of PPO UPDATES between checkpoints (will be converted to steps in script)
    save_path: "outputs/checkpoints/"
    name_prefix: "kon_artist_ppo"
    load_last: true # Automatically load the last checkpoint if it exists
  wandb:
    project: "kon-artist"
    entity: "ml-sound"

# Manifold Alignment Tracking
manifold_alignment:
  target_clusters: [0, 3, 9]
  log_freq_updates: 1
  sample_size: 128
