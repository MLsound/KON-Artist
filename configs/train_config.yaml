# KON-Artist Training Configuration
# Colab 5h limit: 70,560 to 88,200 steps max (17~21 iterations for 4096 n_steps)

# PPO Hyperparameters
ppo:
  total_updates: 15 # Total number of PPO updates (each update processes N_STEPS)
  n_steps: 4096 # 2048 is PPO's default rollout buffer size; adjust if using a custom buffer implementation
  epochs: 15 # Number of epochs per PPO update (default is 4 in stable-baselines3)
  batch_size: 256 # Batch size for PPO updates (default is 64 in stable-baselines3, but can be adjusted based on memory constraints)
  clip_range: 0.3 # PPO clipping parameter (default is 0.2, but can be adjusted for stability)
  learning_rate: 0.0001 # Learning rate for PPO optimizer (default is 0.0003 in stable-baselines3)
  entropy:
    initial: 0.05 # Initial entropy coefficient (encourages exploration)
    final: 0.005  # Final entropy coefficient (can be decayed over time to encourage exploitation)
  bonus: True # Whether to use a reward bonus for successful episodes (can be adjusted based on task requirements)
  bonus_amount: 50.0 # Multiplier for the continuous reward bonus
  biasing:
    enabled: True
    # [jitter, shimmer, tilt, harmonics, threshold, ratio, bitrate]
    target_signature: [-0.8, -0.8, -0.5, 0.0, 0.0, 1.0, 1.0]
  policy: "MlpPolicy"
  verbose: 1

# Environment Settings
env:
  n_envs: -1 # -1 means auto-scale based on CPU cores (All cores - 1)
  seed: 42
  success_threshold: 0.5 # Threshold for considering an episode successful (based on reward)
  step_limit: 10  # Maximum steps per episode to prevent infinite loops (can be adjusted based on task complexity)

# Audio Data Settings
audio:
  split: "train"
  buffer_size: 1000 # Number of audio samples into memory at once for training. Adjust based on available RAM. (Ideally between 5,000 and 20,000 for ASVspoof)

# Model Settings
model:
  detector_name: "MTUCI/AASIST3"
  device: "cuda" # Execution hardware: "cuda" (Enforced GPU) or "cpu" (Standard execution)

# Logging & Callbacks
logging:
  log_dir: "outputs/"
  tensorboard_log: null # Set to a path if tensorboard is needed
  reward_log_freq: 1 # Log rewards every N updates (will be converted to steps in script)
  time_per_step: 0.16817 # Average time per step in seconds for estimation 
  checkpoint:
    save_freq: 1 # Number of PPO UPDATES between checkpoints (will be converted to steps in script)
    save_path: "outputs/checkpoints/"
    name_prefix: "kon_artist_ppo"
    load_last: true # Automatically load the last checkpoint if it exists
  wandb:
    project: "kon-artist"
    entity: "ml-sound"
